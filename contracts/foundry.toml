[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = ".solc/solc-0.8.30"   # official 0.8.30 static build; or set solc = "0.8.30" to let Foundry download it
# PureChain (Clique, Cancun) and other PoA EVM chains: conservative fork target.
evm_version = "paris"
optimizer = true
optimizer_runs = 10000
remappings = ["forge-std/=lib/forge-std/src/"]
gas_reports = ["RightsRegistry", "SiteRights"]

[fuzz]
runs = 2000
seed = "0x0ff1ce27"
